<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Skills — 16,500 workflows for tool-using agents</title>
  <desc id="desc">A dark, neon-accented workflow banner showing an agent moving from scope and evidence through tools, verification, and a clear stop condition.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080D1B"/>
      <stop offset="0.55" stop-color="#10172C"/>
      <stop offset="1" stop-color="#071C25"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.52" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="47%" r="64%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#080D1B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="500" rx="30" fill="url(#bg)"/>
  <rect width="1440" height="500" rx="30" fill="url(#grid)"/>
  <rect width="1440" height="500" rx="30" fill="url(#glow)"/>
  <path d="M0 420C250 350 400 495 660 420S1075 315 1440 410" fill="none" stroke="#38BDF8" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M0 448C270 380 430 520 720 438S1115 345 1440 430" fill="none" stroke="#A78BFA" stroke-opacity="0.10" stroke-width="2"/>

  <g fill="none" stroke="url(#accent)" stroke-opacity="0.50" stroke-width="2">
    <path d="M860 255C970 255 970 150 1080 150H1190"/>
    <path d="M860 255H1085C1160 255 1160 355 1240 355H1350"/>
    <path d="M1010 255C1070 255 1070 415 1145 415"/>
    <path d="M1075 150C1110 150 1120 104 1162 104"/>
  </g>
  <g filter="url(#blurGlow)">
    <circle cx="860" cy="255" r="7" fill="#5EEAD4"/>
    <circle cx="1080" cy="150" r="6" fill="#38BDF8"/>
    <circle cx="1085" cy="255" r="5" fill="#A78BFA"/>
    <circle cx="1240" cy="355" r="6" fill="#5EEAD4"/>
  </g>
  <g fill="#C4B5FD" fill-opacity="0.82">
    <circle cx="1045" cy="94" r="2"/><circle cx="1286" cy="116" r="2"/>
    <circle cx="1363" cy="217" r="2"/><circle cx="1191" cy="300" r="2"/>
    <circle cx="967" cy="371" r="2"/><circle cx="1317" cy="438" r="2"/>
  </g>
  <circle cx="1190" cy="255" r="145" fill="none" stroke="#93C5FD" stroke-opacity="0.09" stroke-width="1"/>
  <circle cx="1190" cy="255" r="112" fill="none" stroke="#5EEAD4" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="5 10"/>
  <circle cx="1190" cy="255" r="77" fill="#0B1324" fill-opacity="0.72" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="2"/>
  <text x="1190" y="248" text-anchor="middle" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">AGENT LOOP</text>
  <text x="1190" y="276" text-anchor="middle" fill="#5EEAD4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="2">BOUNDED · VERIFIED</text>

  <rect x="82" y="66" width="310" height="40" rx="20" fill="#0C2430" stroke="#2DD4BF" stroke-opacity="0.40"/>
  <circle cx="105" cy="86" r="5" fill="#5EEAD4"/>
  <text x="123" y="91" fill="#99F6E4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">A PRACTICAL SKILL LIBRARY</text>

  <text x="78" y="190" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="73" font-weight="800" letter-spacing="-2">AGENTIC</text>
  <text x="78" y="270" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="73" font-weight="800" letter-spacing="-2">SKILLS</text>
  <text x="83" y="315" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">16,500 task-focused workflows for tool-using agents</text>
  <text x="83" y="346" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Evidence in. Measurable feedback. Safe, explicit stop conditions.</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.3" text-anchor="middle">
    <rect x="82" y="389" width="138" height="42" rx="12" fill="#101B2E" stroke="#5EEAD4" stroke-opacity="0.55"/>
    <text x="151" y="415" fill="#CCFBF1">SCOPE</text>
    <path d="M229 410h32m-7-7 7 7-7 7" stroke="#64748B" stroke-width="2" fill="none"/>
    <rect x="270" y="389" width="138" height="42" rx="12" fill="#101B2E" stroke="#38BDF8" stroke-opacity="0.55"/>
    <text x="339" y="415" fill="#DBEAFE">INSPECT</text>
    <path d="M417 410h32m-7-7 7 7-7 7" stroke="#64748B" stroke-width="2" fill="none"/>
    <rect x="458" y="389" width="138" height="42" rx="12" fill="#101B2E" stroke="#38BDF8" stroke-opacity="0.55"/>
    <text x="527" y="415" fill="#DBEAFE">ACT</text>
    <path d="M605 410h32m-7-7 7 7-7 7" stroke="#64748B" stroke-width="2" fill="none"/>
    <rect x="646" y="389" width="138" height="42" rx="12" fill="#101B2E" stroke="#A78BFA" stroke-opacity="0.60"/>
    <text x="715" y="415" fill="#EDE9FE">VERIFY</text>
  </g>
  <text x="84" y="464" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.5">SEARCH  /  READ  /  TEST  /  WRITE  /  REVIEW</text>
</svg>
