<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Skills — 16,500 workflows for tool-using agents</title>
  <desc id="desc">A modern, professional banner for the Agentic Skills library showing the agent loop workflow from scope through verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.35" stop-color="#0B1320"/>
      <stop offset="0.7" stop-color="#0A1A2A"/>
      <stop offset="1" stop-color="#020A14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="0.35" stop-color="#06B6D4"/>
      <stop offset="0.7" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="accentReverse" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="0.35" stop-color="#06B6D4"/>
      <stop offset="0.7" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="0.5" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="textGradient2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EC4899"/>
      <stop offset="0.5" stop-color="#F97316"/>
      <stop offset="1" stop-color="#EAB308"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="45%">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#06B6D4" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#EC4899" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="35%">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#1E293B" stroke-opacity="0.5" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E293B" opacity="0.3"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="over"/>
    </filter>
    <linearGradient id="pillBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1A2A"/>
      <stop offset="1" stop-color="#08121C"/>
    </linearGradient>
    <linearGradient id="pillBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="heroGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.15" stop-color="#E2E8F0"/>
      <stop offset="0.5" stop-color="#94A3B8"/>
      <stop offset="1" stop-color="#64748B"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="500" rx="32" fill="url(#bg)"/>
  <rect width="1440" height="500" rx="32" fill="url(#grid)"/>
  <rect width="1440" height="500" rx="32" fill="url(#dots)"/>
  <rect width="1440" height="500" rx="32" fill="url(#glow1)"/>
  <rect width="1440" height="500" rx="32" fill="url(#glow2)"/>
  <rect width="1440" height="500" rx="32" fill="url(#glow3)"/>

  <path d="M0 450 C200 350 400 520 600 430 S1000 300 1440 420" fill="none" stroke="url(#accent)" stroke-opacity="0.15" stroke-width="2"/>
  <path d="M0 470 C180 400 380 550 580 450 S980 330 1440 440" fill="none" stroke="url(#accentReverse)" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="8 12"/>

  <g fill="none" stroke="url(#accent)" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round">
    <path d="M1020 220 C1100 220 1100 140 1180 140 H1270"/>
    <path d="M1020 220 H1200 C1260 220 1260 290 1310 290 H1390"/>
    <path d="M1140 220 C1190 220 1190 350 1240 350"/>
    <path d="M1180 140 C1210 140 1220 95 1255 95"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="1020" cy="220" r="8" fill="#14B8A6"/>
    <circle cx="1180" cy="140" r="7" fill="#06B6D4"/>
    <circle cx="1200" cy="220" r="6" fill="#8B5CF6"/>
    <circle cx="1310" cy="290" r="7" fill="#14B8A6"/>
    <circle cx="1255" cy="95" r="5" fill="#EC4899"/>
  </g>
  <g fill="#A5B4FC" fill-opacity="0.6">
    <circle cx="1230" cy="80" r="2"/><circle cx="1420" cy="105" r="2"/>
    <circle cx="1380" cy="200" r="2"/><circle cx="1280" cy="275" r="2"/>
    <circle cx="1120" cy="340" r="2"/><circle cx="1390" cy="395" r="2"/>
  </g>
  <circle cx="1200" cy="220" r="160" fill="none" stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1"/>
  <circle cx="1200" cy="220" r="125" fill="none" stroke="#14B8A6" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="6 12"/>
  <circle cx="1200" cy="220" r="88" fill="#05101C" fill-opacity="0.9" stroke="url(#pillBorder)" stroke-opacity="0.7" stroke-width="2"/>
  <text x="1200" y="212" text-anchor="middle" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="3" filter="url(#textGlow)">AGENT LOOP</text>
  <text x="1200" y="242" text-anchor="middle" fill="#14B8A6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="2.5">BOUNDED · VERIFIED · REPRODUCIBLE</text>

  <rect x="82" y="55" width="340" height="44" rx="22" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-opacity="0.6" stroke-width="1.5"/>
  <circle cx="107" cy="77" r="6" fill="#14B8A6" filter="url(#glow)"/>
  <text x="125" y="82" fill="#5EEAD4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">A PRACTICAL SKILL LIBRARY</text>

  <text x="78" y="175" fill="url(#heroGradient)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="900" letter-spacing="-3" filter="url(#textGlow)">AGENTIC</text>
  <text x="78" y="255" fill="url(#textGradient)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="900" letter-spacing="-3" filter="url(#textGlow)">SKILLS</text>
  <text x="83" y="300" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" letter-spacing="-0.5">16,500+ task-focused workflows for tool-using agents</text>
  <text x="83" y="330" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400">Evidence in. Measurable feedback. Safe, explicit stop conditions.</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">
    <rect x="82" y="378" width="138" height="46" rx="14" fill="url(#pillBg)" stroke="#14B8A6" stroke-opacity="0.7" stroke-width="1.5" filter="url(#innerGlow)"/>
    <text x="151" y="406" fill="#5EEAD4">SCOPE</text>
    <path d="M229 401h32m-7-7 7 7-7 7" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="270" y="378" width="138" height="46" rx="14" fill="url(#pillBg)" stroke="#06B6D4" stroke-opacity="0.7" stroke-width="1.5" filter="url(#innerGlow)"/>
    <text x="339" y="406" fill="#67E8F9">INSPECT</text>
    <path d="M417 401h32m-7-7 7 7-7 7" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="458" y="378" width="138" height="46" rx="14" fill="url(#pillBg)" stroke="#06B6D4" stroke-opacity="0.7" stroke-width="1.5" filter="url(#innerGlow)"/>
    <text x="527" y="406" fill="#67E8F9">ACT</text>
    <path d="M605 401h32m-7-7 7 7-7 7" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="646" y="378" width="138" height="46" rx="14" fill="url(#pillBg)" stroke="#8B5CF6" stroke-opacity="0.75" stroke-width="1.5" filter="url(#innerGlow)"/>
    <text x="715" y="406" fill="#C4B5FD">VERIFY</text>
  </g>
  <text x="84" y="452" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="500" letter-spacing="1.2">SEARCH  •  READ  •  TEST  •  WRITE  •  REVIEW</text>

  <g transform="translate(1100, 40)">
    <rect x="0" y="0" width="280" height="120" rx="16" fill="#08121C" fill-opacity="0.8" stroke="url(#pillBorder)" stroke-opacity="0.4" stroke-width="1"/>
    <text x="140" y="32" text-anchor="middle" fill="#14B8A6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">KEY CAPABILITIES</text>
    <text x="20" y="58" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500">✓  Deterministic workflows</text>
    <text x="20" y="78" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500">✓  Built-in verification</text>
    <text x="20" y="98" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500">✓  Zero-config adoption</text>
    <text x="150" y="58" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500">✓  Cross-language support</text>
    <text x="150" y="78" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500">✓  CI/CD ready</text>
    <text x="150" y="98" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500">✓  Extensible by design</text>
  </g>
</svg>