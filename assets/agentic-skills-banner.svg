<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Agentic Skills — 15,860 workflows for tool-using agents</title>
  <desc id="banner-desc">A deep forest-green banner with lime typography and a connected five-level skill tree. The example follows Software and Development, Implementation and Code Architecture, Python services, API evolution, and a Scope and Baseline Record skill. The footer shows current category, subject, topic, workflow-group, and skill counts.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11281f"/>
      <stop offset="1" stop-color="#081710"/>
    </linearGradient>
    <radialGradient id="canopy" cx="90%" cy="8%" r="76%">
      <stop offset="0" stop-color="#355b35" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#355b35" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="branch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c7358"/>
      <stop offset="1" stop-color="#d5fc86"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#a5c0aa" fill-opacity="0.12"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1440" height="680" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1440" height="680" fill="url(#background)"/>
    <rect width="1440" height="680" fill="url(#canopy)"/>
    <rect x="704" width="736" height="548" fill="url(#dots)"/>
    <path d="M704 0v548" stroke="#294032" stroke-opacity="0.65"/>
    <path d="M0 548h1440" stroke="#36503e"/>
    <rect y="549" width="1440" height="131" fill="#081710" fill-opacity="0.58"/>

    <!-- Brand mark: one trunk, three connected leaves. -->
    <g transform="translate(64 41)" fill="none" stroke="#d5fc86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 6v23M7 14h16M7 26h16"/>
      <rect x="2" y="0" width="10" height="8" rx="2" fill="#d5fc86" stroke="none"/>
      <rect x="22" y="10" width="10" height="8" rx="2"/>
      <rect x="22" y="22" width="10" height="8" rx="2"/>
    </g>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="114" y="62" fill="#c1d0c5" font-size="13" font-weight="700" letter-spacing="2.2">A LIBRARY FOR TOOL-USING AGENTS</text>
      <text x="64" y="193" fill="#f4f2e9" font-size="91" font-weight="800" letter-spacing="-4">AGENTIC</text>
      <text x="60" y="298" fill="#d5fc86" font-size="113" font-weight="800" letter-spacing="-5">SKILLS<tspan fill="#f4f2e9">.</tspan></text>
      <text x="68" y="356" fill="#f4f2e9" font-size="26" letter-spacing="-0.5">Find the right workflow.</text>
      <text x="68" y="393" fill="#b0c2b5" font-size="21">Follow the branch. Make it verifiable.</text>

      <rect x="64" y="430" width="574" height="48" rx="10" fill="#1b3326" stroke="#385341"/>
      <g fill="#d7e2d8" font-size="14" font-weight="600">
        <text x="84" y="460">CATEGORY</text>
        <text x="206" y="460">SUBJECT</text>
        <text x="319" y="460">TOPIC</text>
        <text x="410" y="460">CONTEXT</text>
        <text x="534" y="460" fill="#d5fc86">SKILL</text>
      </g>
      <g fill="none" stroke="#91af79" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m181 450 5 5-5 5M174 455h12"/>
        <path d="m293 450 5 5-5 5M286 455h12"/>
        <path d="m384 450 5 5-5 5M377 455h12"/>
        <path d="m508 450 5 5-5 5M501 455h12"/>
      </g>
      <text x="68" y="512" fill="#94af9c" font-size="11" font-weight="700" letter-spacing="1.7">PLAIN MARKDOWN. PURPOSEFUL STRUCTURE.</text>

      <!-- One real path through the library; indents represent navigation depth. -->
      <text x="760" y="62" fill="#adc3b3" font-size="12" font-weight="700" letter-spacing="2.1">FOLLOW A BRANCH</text>
      <text x="1374" y="62" fill="#adc3b3" font-family="monospace" font-size="12" text-anchor="end">01 / EXPLORE</text>
      <g fill="none" stroke="url(#branch)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M778 164v29q0 12 12 12h18"/>
        <path d="M814 248v29q0 12 12 12h18"/>
        <path d="M850 332v29q0 12 12 12h18"/>
        <path d="M886 416v29q0 12 12 12h18"/>
      </g>

      <rect x="760" y="100" width="614" height="64" rx="12" fill="#142b20" stroke="#3b5945"/>
      <circle cx="790" cy="132" r="12" fill="#253f2f"/>
      <text x="790" y="136" text-anchor="middle" fill="#bdd2b5" font-family="monospace" font-size="11">01</text>
      <text x="816" y="122" fill="#9fb5a6" font-size="10" font-weight="700" letter-spacing="1.8">CATEGORY</text>
      <text x="816" y="146" fill="#edf2e8" font-size="19" font-weight="600">Software &amp; Development</text>
      <path d="m1344 128 5 4-5 4" fill="none" stroke="#8eaa96" stroke-width="1.5" stroke-linecap="round"/>

      <rect x="796" y="184" width="578" height="64" rx="12" fill="#172f22" stroke="#42644b"/>
      <circle cx="826" cy="216" r="12" fill="#294732"/>
      <text x="826" y="220" text-anchor="middle" fill="#c5d9b6" font-family="monospace" font-size="11">02</text>
      <text x="852" y="206" fill="#a5bea8" font-size="10" font-weight="700" letter-spacing="1.8">SUBJECT</text>
      <text x="852" y="230" fill="#edf2e8" font-size="19" font-weight="600">Implementation &amp; Code Architecture</text>

      <rect x="832" y="268" width="542" height="64" rx="12" fill="#1b3525" stroke="#54774e"/>
      <circle cx="862" cy="300" r="12" fill="#345331"/>
      <text x="862" y="304" text-anchor="middle" fill="#d3e6b6" font-family="monospace" font-size="11">03</text>
      <text x="888" y="290" fill="#b0c79d" font-size="10" font-weight="700" letter-spacing="1.8">TOPIC</text>
      <text x="888" y="314" fill="#edf2e8" font-size="19" font-weight="600">Python services</text>
      <path d="M1326 295h20m-20 5h14m-14 5h20" fill="none" stroke="#7e9a69" stroke-width="1.5" stroke-linecap="round"/>

      <rect x="868" y="352" width="506" height="64" rx="12" fill="#253e27" stroke="#789556"/>
      <circle cx="898" cy="384" r="12" fill="#496334"/>
      <text x="898" y="388" text-anchor="middle" fill="#e1f4be" font-family="monospace" font-size="11">04</text>
      <text x="924" y="374" fill="#c3d9a8" font-size="10" font-weight="700" letter-spacing="1.8">CONTEXT / WORKFLOW GROUP</text>
      <text x="924" y="398" fill="#edf2e8" font-size="19" font-weight="600">API evolution</text>

      <rect x="904" y="436" width="470" height="76" rx="12" fill="#d5fc86"/>
      <rect x="926" y="458" width="27" height="32" rx="4" fill="none" stroke="#314c23" stroke-width="1.6"/>
      <path d="M933 468h13m-13 6h13m-13 6h8" fill="none" stroke="#314c23" stroke-width="1.6" stroke-linecap="round"/>
      <text x="972" y="460" fill="#3e592c" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1.5">SKILL.md</text>
      <text x="972" y="488" fill="#152910" font-size="22" font-weight="700" letter-spacing="-0.4">Scope &amp; baseline record</text>

      <!-- Values with data-count attributes are refreshed by sync_catalog.py. -->
      <g fill="#f4f2e9" font-size="40" font-weight="700" letter-spacing="-1.4">
        <text x="64" y="611" data-count="categories">12</text>
        <text x="335" y="611" data-count="subjects">65</text>
        <text x="606" y="611" data-count="topics">724</text>
        <text x="877" y="611" data-count="groups">1,629</text>
        <text x="1148" y="611" data-count="skills" fill="#d5fc86">15,860</text>
      </g>
      <g fill="#a8bfaf" font-size="11" font-weight="700" letter-spacing="1.7">
        <text x="66" y="641">CATEGORIES</text>
        <text x="337" y="641">SUBJECTS</text>
        <text x="608" y="641">TOPIC BRANCHES</text>
        <text x="879" y="641">WORKFLOW GROUPS</text>
        <text x="1150" y="641">SKILL PACKAGES</text>
      </g>
      <path d="M301 580v61m271-61v61m271-61v61m271-61v61" stroke="#2e4736"/>
    </g>
    <rect x="0.5" y="0.5" width="1439" height="679" rx="23.5" fill="none" stroke="#4b6751" stroke-opacity="0.65"/>
  </g>
</svg>
